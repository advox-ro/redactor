# Every pull request is checked: the code, the question pool and the quizzes. A quiz's pull request
# (a branch quiz/<slug> that changes nothing but files in quizzes/: the quiz, its photo, its
# evidence) also has every new or changed news quiz checked against its articles (check-quiz, with
# quizzes/evidence/<slug>.json). When everything passes, it is merged and deployed, which publishes
# it. A pull request that fails stays open, with the reason in this log.
name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - name: Check types
        run: npx tsc -p .
      - name: Test
        run: npx vitest run
      - name: Check the question pool
        run: node questions/validate.mjs
      - name: Check the quizzes
        run: npm run validate

      - name: Which files the pull request changes
        id: files
        run: |
          git diff --name-only --diff-filter=AM origin/main...HEAD > changed.txt
          git diff --name-only --diff-filter=D origin/main...HEAD > removed.txt
          cat changed.txt removed.txt
          # Only quiz files, on a quiz/ branch, and nothing removed: such a pull request publishes itself.
          if [ "${GITHUB_HEAD_REF#quiz/}" != "$GITHUB_HEAD_REF" ] && [ ! -s removed.txt ] && [ -s changed.txt ] \
            && ! grep -qvE '^quizzes/([a-z0-9-]+\.md|photos/[a-z0-9-]+\.jpg|evidence/[a-z0-9-]+\.json)$' changed.txt; then
            echo "quiz=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check each news quiz against its articles
        if: steps.files.outputs.quiz == 'true'
        run: |
          for f in $(grep -E '^quizzes/[a-z0-9-]+\.md$' changed.txt); do
            slug=$(basename "$f" .md)
            grep -q '^date:' "$f" || continue
            [ -f "quizzes/evidence/$slug.json" ] || { echo "::error::$f has no quizzes/evidence/$slug.json"; exit 1; }
            npm run -s check-quiz -- "$f" "quizzes/evidence/$slug.json"
          done

      - name: Publish
        if: steps.files.outputs.quiz == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
          gh workflow run deploy.yml --ref main
