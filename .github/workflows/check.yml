# Every pull request is checked: the code, the question pool, the wiki and the quizzes. The editor's
# pull requests (EDITOR.md) publish themselves when everything passes: they are merged and deployed.
# There are two kinds:
#   quiz/<slug>      only the quiz's files in quizzes/ (the quiz and its photo); every new or
#                    changed news quiz is also checked against its articles, by the quotes under
#                    its facts (check-quiz)
#   content/<slug>   only wiki pages and question pool files; a question already in the pool must
#                    keep what it asks (scripts/pool-unchanged.mjs)
# When a check fails, the reason goes in a comment on the pull request, where the editor reads it
# and fixes it.
name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    # bash with pipefail: a check piped into tee still fails the step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      # The content the Worker is built with (scripts/content.ts); the type check needs it too.
      - name: Build the content
        run: npm run content
      # Each check's output also goes to check.log, for the comment when one fails.
      - name: Check types
        run: npx tsc -p . 2>&1 | tee -a check.log
      - name: Test
        run: npx vitest run 2>&1 | tee -a check.log
      - name: Check the question pool
        run: node questions/validate.mjs 2>&1 | tee -a check.log
      - name: Check the quizzes
        run: npm run validate 2>&1 | tee -a check.log

      - name: Which files the pull request changes
        id: files
        run: |
          git diff --name-only --diff-filter=AM origin/main...HEAD > changed.txt
          git diff --name-only --diff-filter=D origin/main...HEAD > removed.txt
          cat changed.txt removed.txt
          # The editor's two kinds of pull request, with nothing removed, publish themselves.
          if [ -s removed.txt ] || [ ! -s changed.txt ]; then exit 0; fi
          if [ "${GITHUB_HEAD_REF#quiz/}" != "$GITHUB_HEAD_REF" ] \
            && ! grep -qvE '^quizzes/([a-z0-9-]+\.md|photos/[a-z0-9-]+\.jpg)$' changed.txt; then
            echo "quiz=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${GITHUB_HEAD_REF#content/}" != "$GITHUB_HEAD_REF" ] \
            && ! grep -qvE '^(wiki/[a-z][a-z0-9-]*\.md|questions/[a-z][a-z0-9-]*\.jsonl)$' changed.txt; then
            echo "content=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check each news quiz against its articles
        if: steps.files.outputs.quiz == 'true'
        run: |
          for f in $(grep -E '^quizzes/[a-z0-9-]+\.md$' changed.txt); do
            grep -q '^date:' "$f" || continue
            npm run -s check-quiz -- "$f" 2>&1 | tee -a check.log
          done

      - name: Check that existing questions keep what they ask
        if: steps.files.outputs.content == 'true'
        run: node scripts/pool-unchanged.mjs origin/main 2>&1 | tee -a check.log

      - name: Publish
        if: steps.files.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
          gh workflow run deploy.yml --ref main

      - name: Say why it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Verificările nu au trecut. Ultimele rânduri:"; echo; echo '```'; tail -n 60 check.log 2>/dev/null; echo '```'; } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
