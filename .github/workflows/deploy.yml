# Every push to main checks redactor, deploys it to Cloudflare, then syncs its knowledge base with
# the site repository (src/sync.ts). "Run workflow" on the Actions tab does it by hand. Wrangler's
# own output goes to a file, not the public log: it can name the Cloudflare account. On failure the
# log shows only its error lines, with emails and account names blanked out.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - name: Check types
        run: npx tsc -p .
      - name: Test
        run: npx vitest run
      - name: Check the quizzes
        env:
          REDACTOR_TOKEN: ${{ secrets.REDACTOR_TOKEN }}
        run: npm run validate

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply redactor --remote > wrangler.log 2>&1 || { .github/redact-tail.sh wrangler.log; exit 1; }

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy > wrangler.log 2>&1 || { .github/redact-tail.sh wrangler.log; exit 1; }
          grep -o 'Current Version ID: [0-9a-f-]*' wrangler.log || true

      - name: Sync the knowledge base
        env:
          REDACTOR_TOKEN: ${{ secrets.REDACTOR_TOKEN }}
        run: 'curl -fsS -X POST -H "Authorization: Bearer $REDACTOR_TOKEN" https://redactor.advox.ro/sync'
